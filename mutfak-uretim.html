<div id="boot"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'kitchen' });
  if (!c) return;
  const d = ES.kitchenDate(), k = c.kitchen;
  const root = ES.mountKitchen('uretim', 'Üretim Planı', 'Sıfır atık için +%5 tampon payıyla günlük pişirme çizelgesi · ' + ES.trDate(d), '<button onclick="window.print()" class="inline-flex items-center gap-2 min-h-[44px] px-5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant font-body text-label-lg"><span class="material-symbols-outlined text-[18px]">print</span>Yazdır</button>');
  let rows = [];
  try { rows = await ES.q(ES.sb.rpc('production_plan', { p_kitchen: k.id, p_date: d })); } catch (e) { ES.fail(e); return; }
  const next = { waiting: 'cooking', cooking: 'ready', ready: 'waiting' };
  const chip = { waiting: ['bg-light-surface-container-high text-light-on-surface-variant', 'Bekliyor'], cooking: ['bg-warning-container text-on-warning-container', 'Hazırlanıyor'], ready: ['bg-success-container text-on-success-container', 'Hazır'] };
  function render() {
    const tot = rows.reduce((a, r) => a + r.total, 0), buf = rows.reduce((a, r) => a + r.buffered, 0);
    root.innerHTML = rows.length ?
    '<div class="w-full bg-light-surface-container-lowest rounded-lg border border-light-outline-variant shadow-sm overflow-hidden"><table class="w-full text-left border-collapse"><thead><tr class="bg-light-surface-container-low border-b border-light-outline-variant">' + ['Yemek Adı', 'Sipariş (Öğle / Akşam)', '+%5 Tampon', 'Malzeme İhtiyacı', 'Başlangıç', 'Durum'].map((h) => '<th class="px-5 py-3.5 text-light-on-surface-variant font-body text-label-md">' + h + '</th>').join('') + '</tr></thead><tbody class="divide-y divide-light-outline-variant">' +
    rows.map((r, i) => '<tr><td class="px-5 py-4 font-body text-title-md">' + ES.esc(r.item_name) + '</td><td class="px-5 py-4 tabular-nums font-body text-body-md">' + r.total + ' (' + r.ogle + ' Öğle / ' + r.aksam + ' Akşam)</td><td class="px-5 py-4 tabular-nums font-body text-label-md text-light-primary">' + r.buffered + ' porsiyon</td><td class="px-5 py-4 font-body text-body-sm text-light-on-surface-variant">' + ES.esc(r.ingredients || '—') + '</td><td class="px-5 py-4 font-mono text-mono-sm tabular-nums">' + ES.hm(r.prep_start) + '</td><td class="px-5 py-4"><button data-i="' + i + '" class="inline-flex px-3 py-1 rounded-full ' + chip[r.status][0] + ' font-body text-label-sm">' + chip[r.status][1] + '</button></td></tr>').join('') +
    '</tbody></table></div><p class="font-body text-body-md text-light-on-surface-variant">Toplam <b>' + tot + '</b> porsiyon sipariş, <b>' + buf + '</b> porsiyon üretim (planlı pay: ' + (buf - tot) + ' porsiyon). Durum etiketine tıklayarak Bekliyor → Hazırlanıyor → Hazır geçişini yapabilirsin.</p>' :
    '<div class="bg-light-surface-container-lowest rounded-lg p-gutter-xl border border-light-outline-variant font-body text-body-lg text-light-on-surface-variant">Bu tarih için henüz sipariş yok, üretim planı boş.</div>';
    root.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', async () => {
      const r = rows[Number(b.dataset.i)], ns = next[r.status];
      try { await ES.q(ES.sb.from('production_status').upsert({ kitchen_id: k.id, target_date: d, item_name: r.item_name, status: ns })); r.status = ns; render(); } catch (e) { ES.fail(e); }
    }));
  }
  render();
})();
</script>
