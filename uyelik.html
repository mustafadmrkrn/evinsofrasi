<body class="bg-light-surface text-light-on-surface font-body antialiased">
<div class="min-h-[884px] max-w-[390px] mx-auto bg-light-surface flex flex-col pb-24" id="app"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'customer' });
  if (!c) return;
  const app = document.getElementById('app');
  const today = ES.todayISO();
  let subs = [], past = [];
  async function load() {
    subs = await ES.q(ES.sb.from('subscriptions').select('*, packages(name,days,kind), slots(start_time,end_time), subscription_days(id,day,skipped,paused_skip, menu_sets(title))').in('status', ['active', 'paused']).order('id', { ascending: false }).limit(1));
    past = await ES.q(ES.sb.from('orders').select('*, order_items(name,qty)').neq('status', 'cancelled').lte('target_date', today).order('target_date', { ascending: false }).limit(10));
  }
  async function render() {
    try { await load(); } catch (e) { ES.fail(e); }
    const s = subs[0];
    let card;
    if (!s) {
      card = '<section class="bg-light-surface-container-lowest rounded-lg p-gutter-lg border border-light-outline-variant shadow-sm flex flex-col gap-gutter-md"><h1 class="font-headline text-headline-sm">Aktif paketin yok</h1><p class="font-body text-body-md text-light-on-surface-variant">Haftalık veya aylık pakete geçerek %22\'ye varan avantaj kazan, her gün sipariş vermekle uğraşma.</p><a href="paketler.html" class="inline-flex items-center justify-center min-h-[48px] px-6 rounded-full bg-light-primary text-light-on-primary font-body text-label-lg">Paketlere Göz At</a></section>';
    } else {
      const days = s.subscription_days.slice().sort((a, b) => a.day.localeCompare(b.day));
      const upcoming = days.filter((d) => d.day > today && !d.skipped);
      const next = upcoming[0];
      const paused = s.status === 'paused';
      const skippable = days.filter((d) => d.day > today && !d.skipped);
      card = '<section class="bg-light-primary text-light-on-primary rounded-lg p-gutter-lg shadow-sm flex flex-col gap-gutter-md"><div class="flex items-start justify-between gap-gutter-sm"><div><span class="inline-flex px-2.5 py-0.5 rounded-full bg-light-secondary text-light-on-secondary font-body text-label-sm mb-2">' + (paused ? 'Duraklatıldı' : 'Aktif Üyelik') + '</span><h1 class="font-headline text-headline-sm">' + ES.esc(s.packages.name) + '</h1></div><div class="text-right"><span class="block font-headline text-headline-md tabular-nums">' + upcoming.length + '</span><span class="block font-body text-body-sm opacity-90">gün kaldı</span></div></div>' +
      '<div class="p-gutter-md rounded-md bg-light-on-primary-container text-light-on-primary flex items-center justify-between"><div><span class="block font-body text-label-sm opacity-90">Sonraki Teslimat</span><span class="block font-body text-title-md tabular-nums">' + (next ? ES.trDate(next.day) + ' · ' + ES.hm(s.slots.start_time) + ' – ' + ES.hm(s.slots.end_time) : paused ? 'Duraklatıldı' : 'Planlı gün yok') + '</span></div><span class="material-symbols-outlined text-[24px]">local_shipping</span></div>' +
      (s.credit_days ? '<p class="font-body text-body-sm opacity-90">' + s.credit_days + ' günlük hakkın saklı. Yeni paketle birlikte kullanabilirsin.</p>' : '') +
      '<div class="grid grid-cols-3 gap-gutter-sm"><button id="pause" class="min-h-[44px] px-2 rounded-full bg-light-surface-container-lowest text-light-primary font-body text-label-sm">' + (paused ? 'Devam Ettir' : 'Duraklat') + '</button><button id="skipbtn" class="min-h-[44px] px-2 rounded-full bg-light-surface-container-lowest text-light-primary font-body text-label-sm">Günü atla</button><a href="paketler.html" class="inline-flex items-center justify-center min-h-[44px] px-2 rounded-full bg-light-secondary text-light-on-secondary font-body text-label-sm">Paketi yenile</a></div>' +
      '<div id="skiplist" class="hidden flex-col gap-gutter-sm bg-light-surface text-light-on-surface rounded-md p-gutter-md">' + (skippable.length ? '<span class="font-body text-label-md">Hangi günü atlamak istiyorsun?</span>' + skippable.map((d) => '<button data-skip="' + d.day + '" class="flex items-center justify-between min-h-[44px] px-3 rounded-md border border-light-outline-variant bg-light-surface-container-lowest font-body text-body-md"><span>' + ES.trDate(d.day) + ' ' + ES.DOW[ES.dowOf(d.day)] + ' · ' + ES.esc(d.menu_sets ? d.menu_sets.title : '') + '</span><span class="material-symbols-outlined text-[18px] text-light-secondary">skip_next</span></button>').join('') : '<span class="font-body text-body-md">Atlanabilecek gün yok (bugün kapanan günler atlanamaz).</span>') + '</div></section>';
    }
    app.innerHTML = ES.appHeader('Üyeliğim', c.profile.full_name || '', '<a href="paketler.html" class="px-3 py-1.5 rounded-full bg-light-primary-container text-light-on-primary-container font-body text-label-md">Paketler</a>') +
    '<main class="flex-1 px-page-margin py-gutter-lg flex flex-col gap-gutter-xl">' + card +
    '<section class="flex flex-col gap-gutter-md"><h2 class="font-headline text-headline-sm">Geçmiş Siparişler</h2>' + (past.length ? past.map((o) => '<article class="bg-light-surface-container-lowest rounded-lg p-gutter-lg border border-light-outline-variant shadow-sm flex flex-col gap-gutter-md"><div class="flex items-start justify-between"><div><span class="block font-body text-body-sm text-light-on-surface-variant tabular-nums">' + ES.trDate(o.target_date) + ' · ' + ES.MEAL[o.meal] + '</span><h3 class="font-body text-title-md">' + o.order_items.map((i) => ES.esc(i.name)).join(', ') + '</h3></div><span class="font-body text-title-md text-light-primary tabular-nums">' + ES.money(o.total) + '</span></div><div class="flex items-center justify-between pt-2 border-t border-light-outline-variant"><div class="flex items-center gap-0.5 text-terracotta">' + [1, 2, 3, 4, 5].map((n) => '<button data-rate="' + o.id + ':' + n + '" aria-label="' + n + ' yıldız" class="leading-none"><span class="material-symbols-outlined text-[20px] ' + (o.rating && n <= o.rating ? '' : 'text-light-outline-variant') + '" style="' + (o.rating && n <= o.rating ? "font-variation-settings:'FILL' 1;" : '') + '">star</span></button>').join('') + '</div><a href="menu.html?reorder=' + o.id + '" class="inline-flex items-center justify-center min-h-[40px] px-4 rounded-full bg-light-primary text-light-on-primary font-body text-label-md">Tekrar Sipariş Ver</a></div></article>').join('') : '<p class="font-body text-body-md text-light-on-surface-variant">Henüz geçmiş siparişin yok.</p>') + '</section></main>' + ES.tabbar('uyelik');

    const pb = document.getElementById('pause');
    if (pb) pb.addEventListener('click', () => ES.busy(pb, async () => { await ES.q(ES.sb.rpc('set_subscription_paused', { p_sub: s.id, p_pause: s.status === 'active' })); ES.toast(s.status === 'active' ? 'Paket duraklatıldı, gelecek siparişler iptal edildi' : 'Paket yeniden başladı', 'ok'); await render(); }));
    const sb2 = document.getElementById('skipbtn');
    if (sb2) sb2.addEventListener('click', () => { const l = document.getElementById('skiplist'); l.classList.toggle('hidden'); l.classList.toggle('flex'); });
    app.querySelectorAll('[data-skip]').forEach((b) => b.addEventListener('click', () => ES.busy(b, async () => { await ES.q(ES.sb.rpc('skip_subscription_day', { p_sub: s.id, p_day: b.dataset.skip })); ES.toast(ES.trDate(b.dataset.skip) + ' günü atlandı', 'ok'); await render(); })));
    app.querySelectorAll('[data-rate]').forEach((b) => b.addEventListener('click', async () => { const [id, n] = b.dataset.rate.split(':').map(Number); try { await ES.q(ES.sb.rpc('rate_order', { p_order: id, p_rating: n })); ES.toast('Puanın kaydedildi, teşekkürler!', 'ok'); await render(); } catch (e) { ES.fail(e); } }));
  }
  await render();
})();
</script>
