<body class="bg-light-surface text-light-on-surface font-body antialiased">
<div class="max-w-[960px] mx-auto p-6">
  <div class="flex items-center justify-between mb-6 gap-3 flex-wrap">
    <div><h1 class="font-headline text-headline-md">Yönetici Paneli</h1><p class="text-body-md text-light-on-surface-variant">Kullanıcı yetkileri ve mutfak erişimi</p></div>
    <div class="flex gap-3 items-center"><select id="kit" class="min-h-[44px] px-3 rounded-md border border-light-outline-variant bg-white"></select><button id="open" class="min-h-[44px] px-4 rounded-full bg-light-primary text-light-on-primary font-label-lg">Mutfak panelini aç</button><button id="out" class="underline text-light-on-surface-variant">Çıkış</button></div>
  </div>
  <input id="s" placeholder="E-posta veya isim ara" class="w-full min-h-[44px] px-3 mb-4 rounded-md border border-light-outline-variant bg-white">
  <div id="list" class="flex flex-col gap-3"></div>
</div>
<script>
(async () => {
  const c = await ES.init({ role: 'customer' });
  if (!c) return;
  if (c.profile.role !== 'admin') { document.body.innerHTML = '<div class="p-8 text-center"><h1 class="font-headline text-headline-sm mb-2">Bu sayfa yöneticiye özeldir</h1><a class="underline text-light-primary" href="anasayfa.html">Uygulamaya dön</a></div>'; return; }
  const kitchens = await ES.q(ES.sb.from('kitchens').select('id,name').order('id'));
  const kopt = (sel) => kitchens.map(k => '<option value="' + k.id + '"' + (k.id === sel ? ' selected' : '') + '>' + ES.esc(k.name) + '</option>').join('');
  const kit = document.getElementById('kit'); kit.innerHTML = kopt(Number(localStorage.getItem('es_kitchen')) || kitchens[0].id);
  document.getElementById('open').onclick = () => { localStorage.setItem('es_kitchen', kit.value); location.href = 'mutfak-sabah.html'; };
  document.getElementById('out').onclick = ES.signOut;
  let users = [];
  const RL = { customer: 'Müşteri', kitchen: 'Mutfak', admin: 'Yönetici' };
  function draw() {
    const t = document.getElementById('s').value.toLowerCase();
    document.getElementById('list').innerHTML = users.filter(u => (u.email + ' ' + (u.full_name || '')).toLowerCase().includes(t)).map(u =>
      '<div class="p-4 rounded-lg bg-white border border-light-outline-variant flex flex-wrap items-center gap-3 justify-between" data-id="' + u.id + '">' +
      '<div class="min-w-0"><div class="font-title-md truncate">' + ES.esc(u.full_name || '-') + '</div><div class="text-body-sm text-light-on-surface-variant truncate">' + ES.esc(u.email) + ' · ' + ES.esc(u.phone || '') + '</div></div>' +
      '<div class="flex gap-2 items-center"><select class="r min-h-[40px] px-2 rounded-md border border-light-outline-variant">' + Object.keys(RL).map(r => '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + RL[r] + '</option>').join('') + '</select>' +
      '<select class="k min-h-[40px] px-2 rounded-md border border-light-outline-variant">' + kopt(u.kitchen_id) + '</select>' +
      '<button class="sv min-h-[40px] px-4 rounded-full bg-light-primary text-light-on-primary">Kaydet</button></div></div>').join('') || '<p class="text-light-on-surface-variant">Kullanıcı yok.</p>';
    document.querySelectorAll('.sv').forEach(b => b.onclick = () => {
      const row = b.closest('[data-id]');
      ES.busy(b, async () => {
        await ES.q(ES.sb.rpc('admin_set_role', { p_user: row.dataset.id, p_role: row.querySelector('.r').value, p_kitchen: Number(row.querySelector('.k').value) }));
        ES.toast('Kaydedildi'); await load();
      });
    });
  }
  async function load() { users = await ES.q(ES.sb.rpc('admin_list_users')); draw(); }
  document.getElementById('s').oninput = draw;
  await load();
})();
</script>
