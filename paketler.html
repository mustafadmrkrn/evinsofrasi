<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body class="bg-light-surface text-light-on-surface font-body antialiased">
<div class="min-h-[884px] max-w-[390px] mx-auto bg-light-surface flex flex-col pb-24" id="app"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'customer' });
  if (!c) return;
  const app = document.getElementById('app');
  if (!c.kitchen) { app.innerHTML = ES.appHeader('Yemek Paketleri', c.district ? c.district.name : '—', '') + ES.noKitchenBanner() + ES.tabbar('uyelik'); return; }
  let pkgs = [], sets = [];
  try {
    pkgs = await ES.q(ES.sb.from('packages').select('*').order('days'));
    sets = await ES.q(ES.sb.from('menu_sets').select('*').eq('kitchen_id', c.kitchen.id).order('code'));
  } catch (e) { ES.fail(e); }
  if (!pkgs.length || !sets.length) { app.innerHTML = ES.appHeader('Yemek Paketleri', c.district.name, '') + '<p class="p-4">Paketler henüz hazır değil.</p>' + ES.tabbar('uyelik'); return; }

  let pkg = pkgs[0], page = 0, sel = 0;
  const dietsAvail = [...new Set(sets.map((s) => s.diet || 'standart'))];
  let diet = dietsAvail.includes('standart') ? 'standart' : dietsAvail[0];
  const setsOf = () => sets.filter((s) => (s.diet || 'standart') === diet);
  const recOf = () => (setsOf().find((s) => s.recommended) || setsOf()[0]).id;
  let choices = [];
  function weekdays(n) { const out = []; let d = ES.tomorrowISO(); while (out.length < n) { const w = ES.dowOf(d); if (w >= 1 && w <= 5) out.push(d); d = ES.addDays(d, 1); } return out; }
  function reset() { choices = weekdays(pkg.days).map((day) => ({ day, set_id: recOf(), skipped: false })); page = 0; sel = 0; }
  reset();

  function render() {
    const per = 5, pages = Math.ceil(choices.length / per);
    const view = choices.slice(page * per, page * per + per);
    const cur = choices[sel];
    const daily = Math.round(pkg.price / pkg.days);
    const skipped = choices.filter((x) => x.skipped).length;
    app.innerHTML = ES.appHeader('Yemek Paketleri', c.district.name + ' / ' + c.district.cities.name, ES.cartPill()) +
    '<main class="flex-1 px-page-margin py-gutter-lg flex flex-col gap-gutter-xl">' +
    '<div role="tablist" class="grid grid-cols-2 p-1 rounded-full bg-light-surface-container border border-light-outline-variant">' + pkgs.map((p) => '<button data-pkg="' + p.id + '" class="min-h-[44px] px-4 py-2 rounded-full font-body text-label-lg ' + (p.id === pkg.id ? 'bg-light-primary text-light-on-primary shadow-sm' : 'text-light-on-surface-variant') + '">' + (p.kind === 'weekly' ? 'Haftalık' : 'Aylık') + ' (' + p.days + ' Gün)</button>').join('') + '</div>' +
    (dietsAvail.length > 1 ? '<section class="flex flex-col gap-gutter-sm"><h2 class="font-headline text-title-lg">Menü Tipi</h2><div class="flex flex-wrap gap-2">' + dietsAvail.map((d) => '<button data-diet="' + d + '" class="min-h-[40px] px-4 rounded-full font-body text-label-lg ' + (d === diet ? 'bg-light-primary text-light-on-primary shadow-sm' : 'bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface-variant') + '">' + ES.esc(ES.DIET[d] || d) + '</button>').join('') + '</div></section>' : '') +
    '<article class="bg-light-surface-container-lowest rounded-lg p-gutter-lg border border-light-outline-variant shadow-sm flex flex-col gap-gutter-md"><div class="flex items-start justify-between gap-gutter-sm"><div><span class="inline-flex px-2.5 py-0.5 rounded-full bg-light-secondary-container text-light-on-secondary-container font-body text-label-sm mb-1.5">%' + pkg.discount_pct + ' İndirimli</span><h1 class="font-headline text-headline-sm">' + ES.esc(pkg.name) + '</h1></div><div class="text-right shrink-0"><span class="block font-headline text-headline-md text-light-primary tabular-nums">' + ES.money(pkg.price) + '</span><span class="block font-body text-body-sm text-light-on-surface-variant tabular-nums">Günlük ' + ES.money(daily) + '</span></div></div>' +
    '<div class="flex flex-wrap gap-2 pt-2 border-t border-light-outline-variant">' + pkg.includes.map((i) => '<span class="px-3 py-1 rounded-full bg-light-surface-container font-body text-label-sm">' + ES.esc(i) + '</span>').join('') + '</div></article>' +
    '<section class="flex flex-col gap-gutter-md"><div class="flex items-center justify-between"><h2 class="font-headline text-title-lg">Günlük Menü Seçimi</h2>' +
      '<div class="flex items-center gap-1">' + (pages > 1 ? '<button id="pp" class="w-9 h-9 rounded-full border border-light-outline-variant" ' + (page === 0 ? 'disabled style="opacity:.4"' : '') + '><span class="material-symbols-outlined text-[18px]">chevron_left</span></button>' : '') + '<span class="font-body text-body-sm text-light-on-surface-variant px-1">' + ES.trDate(view[0].day) + ' – ' + ES.trDate(view[view.length - 1].day) + '</span>' + (pages > 1 ? '<button id="pn" class="w-9 h-9 rounded-full border border-light-outline-variant" ' + (page === pages - 1 ? 'disabled style="opacity:.4"' : '') + '><span class="material-symbols-outlined text-[18px]">chevron_right</span></button>' : '') + '</div></div>' +
    '<div class="grid grid-cols-5 gap-gutter-xs">' + view.map((x, i) => { const idx = page * per + i; const on = idx === sel; return '<button data-day="' + idx + '" class="min-h-[56px] rounded-md flex flex-col items-center justify-center ' + (on ? 'bg-light-primary text-light-on-primary' : 'bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface') + (x.skipped && !on ? ' opacity-50 line-through' : '') + '"><span class="font-body text-label-sm">' + ES.DOW[ES.dowOf(x.day)] + '</span><span class="font-body text-title-md tabular-nums">' + Number(x.day.slice(8)) + '</span></button>'; }).join('') + '</div>' +
    '<div class="bg-light-surface-container-low rounded-lg p-gutter-md border border-light-outline-variant flex items-center justify-between gap-gutter-md"><div><span class="block font-body text-title-md">' + ES.trDate(cur.day) + ' günü yemeği atla</span><span class="block font-body text-body-sm text-light-on-surface-variant">Atlanan gün için sipariş oluşmaz, hakkın korunur</span></div><label class="inline-flex items-center cursor-pointer"><input id="skip" type="checkbox" class="sr-only peer" ' + (cur.skipped ? 'checked' : '') + '><div class="w-12 h-7 bg-light-outline-variant rounded-full peer peer-checked:bg-light-primary relative transition-colors after:content-[\'\'] after:absolute after:top-1 after:left-1 after:bg-light-surface-container-lowest after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div></label></div>' +
    '<div class="flex flex-col gap-gutter-sm ' + (cur.skipped ? 'opacity-40 pointer-events-none' : '') + '">' + setsOf().map((s) => '<label class="bg-light-surface-container-lowest rounded-lg p-gutter-md ' + (cur.set_id === s.id ? 'border-2 border-light-primary' : 'border border-light-outline-variant') + ' flex items-start gap-gutter-md cursor-pointer"><input type="radio" name="set" value="' + s.id + '" ' + (cur.set_id === s.id ? 'checked' : '') + ' class="mt-1 text-light-primary focus:ring-light-primary"><div class="flex-1"><div class="flex items-center justify-between"><span class="font-body text-title-md">' + ES.esc(s.title) + '</span>' + (s.recommended ? '<span class="px-2 py-0.5 rounded-full bg-light-primary-container text-light-on-primary-container font-body text-label-sm">Önerilen</span>' : '') + '</div><p class="font-body text-body-sm text-light-on-surface-variant mt-1">' + s.items.map(ES.esc).join(' · ') + '</p></div></label>').join('') + '</div>' +
    '<p class="font-body text-body-sm text-light-on-surface-variant">Seçili: ' + (choices.length - skipped) + ' gün teslimat' + (skipped ? ', ' + skipped + ' gün atlandı' : '') + '. Paketler hafta içi günleri kapsar.</p></section>' +
    '<button id="go" class="inline-flex items-center justify-center w-full min-h-[52px] px-6 py-3 rounded-full bg-light-primary text-light-on-primary shadow-sm font-body text-label-lg">Paketi Seç ve Devam Et</button></main>' + ES.tabbar('uyelik');
    app.querySelectorAll('[data-pkg]').forEach((b) => b.addEventListener('click', () => { pkg = pkgs.find((p) => p.id === Number(b.dataset.pkg)); reset(); render(); }));
    app.querySelectorAll('[data-diet]').forEach((b) => b.addEventListener('click', () => { diet = b.dataset.diet; reset(); render(); }));
    app.querySelectorAll('[data-day]').forEach((b) => b.addEventListener('click', () => { sel = Number(b.dataset.day); render(); }));
    const pp = document.getElementById('pp'), pn = document.getElementById('pn');
    if (pp) pp.addEventListener('click', () => { page--; sel = page * per; render(); });
    if (pn) pn.addEventListener('click', () => { page++; sel = page * per; render(); });
    document.getElementById('skip').addEventListener('change', (e) => { cur.skipped = e.target.checked; render(); });
    app.querySelectorAll('input[name=set]').forEach((r) => r.addEventListener('change', () => { cur.set_id = Number(r.value); render(); }));
    document.getElementById('go').addEventListener('click', () => {
      if (choices.every((x) => x.skipped)) return ES.toast('En az bir gün seçili olmalı', 'error');
      try { sessionStorage.setItem('es_pkg', JSON.stringify({ package_id: pkg.id, choices })); } catch (e) { return ES.toast('Tarayıcı oturum depolaması kapalı', 'error'); }
      location.href = 'odeme.html?pkg=' + pkg.id;
    });
  }
  render();
})();
</script>
