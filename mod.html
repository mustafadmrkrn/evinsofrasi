<script>
(async () => {
  const c = await ES.init({ role: 'customer', skipMode: true });
  if (!c) return;
  const q = new URLSearchParams(location.search), next = q.get('next') || '';
  const safe = /^[a-z0-9-]+\.html(\?.*)?$/i.test(next) ? next : '';
  let cur = null; try { cur = localStorage.getItem('es_mode'); } catch (e) { /* yok say */ }
  const card = (id, icon, title, sub, pts) => '<button data-mode="' + id + '" class="text-left rounded-xl border-2 ' + (cur === id ? 'border-light-primary' : 'border-light-outline-variant') + ' bg-light-surface-container-lowest p-gutter-lg flex flex-col gap-2 shadow-sm"><div class="flex items-center gap-gutter-md"><div class="w-12 h-12 rounded-full bg-light-primary text-light-on-primary flex items-center justify-center"><span class="material-symbols-outlined text-[26px]">' + icon + '</span></div><div><h2 class="font-headline text-title-lg">' + title + '</h2><span class="font-body text-label-md text-light-on-surface-variant">' + sub + '</span></div></div><ul class="list-disc pl-5 font-body text-body-sm text-light-on-surface-variant">' + pts.map((p) => '<li>' + p + '</li>').join('') + '</ul></button>';
  document.getElementById('app').innerHTML =
    '<div class="flex items-center gap-gutter-md pt-4"><img src="assets/logo.svg" alt="" class="w-12 h-12 rounded-md"><div><h1 class="font-headline text-headline-sm">Yarının Sofrası</h1><span class="font-body text-body-sm text-light-on-surface-variant">Nasıl sipariş vermek istersin?</span></div></div>' +
    card('hot', 'local_fire_department', 'Sıcak Zincir', 'Hazır yemek · sıcak teslim', ['Yarının menüsünden seç, mutfak pişirsin', 'Eve sıcak teslim ya da Gel Al', 'Günlük, haftalık, aylık üyelik']) +
    card('cold', 'ac_unit', 'Soğuk Zincir', 'Yemek kutusu · evde pişir', ['El yapımı, porsiyonlu malzemeler ve tarif kartı', 'Soğuk veya dondurulmuş paket, istediğin saat aralığında teslim', 'Pişirme süresi kısa, kişi sayısına göre kutu']) +
    '<p class="font-body text-label-sm text-light-on-surface-variant text-center">Seçimini istediğin zaman alt menüden değiştirebilirsin. Sipariş her gece 00:00\'da kapanır.</p>';
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    const m = b.dataset.mode; try { localStorage.setItem('es_mode', m); } catch (e) { /* yok say */ }
    const ok = safe && ((m === 'cold' && !/^(anasayfa|menu|paketler|uyelik|odeme|siparis)\.html/.test(safe)) || (m === 'hot' && !/^kutular\.html/.test(safe)));
    location.href = ok ? safe : (m === 'cold' ? 'kutular.html' : 'anasayfa.html');
  }));
})();
