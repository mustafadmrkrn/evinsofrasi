<script>
(async () => {
  const c = await ES.init({ role: 'public', redirectIfAuthed: 'anasayfa.html' });
  if (!c) return;
  const hero = (window.ES_IMG || {}).__hero;
  document.getElementById('hero').innerHTML = hero ? '<img src="' + hero + '" alt="Ev yapımı sıcak Türk yemekleri" class="w-full h-64 object-cover">' : '<div class="w-full h-64 bg-light-primary-container flex items-center justify-center text-light-on-primary-container"><span class="material-symbols-outlined text-[64px]">restaurant</span></div>';
  const slides = [
    { icon: 'local_fire_department', title: 'Bugün sipariş ver, yarın sıcak sıcak gelsin', desc: "Yarının öğle ve akşam yemeklerini bu gece 00:00'a kadar seç, tam saatinde kapında ya da mutfakta hazır olsun." },
    { icon: 'restaurant_menu', title: 'Bölgenin yemekleri, ev lezzetiyle', desc: "Alanya'nın yöresel çorbalarından Hatay'ın kabak boranisine, bulunduğun ilçeye özel günlük taze menü." },
    { icon: 'eco', title: 'Sıfır atık, planlı üretim', desc: 'Mutfak sadece gelen sipariş kadar pişirir. Ne fazla yemek çöpe gider, ne de lezzetten ödün verilir.' }
  ];
  const dots = document.getElementById('dots');
  function show(i) {
    document.getElementById('slide-title').textContent = slides[i].title;
    document.getElementById('slide-desc').textContent = slides[i].desc;
    document.getElementById('slide-icon').textContent = slides[i].icon;
    dots.innerHTML = slides.map((_, j) => '<button data-i="' + j + '" aria-label="Adım ' + (j + 1) + '" class="h-2.5 ' + (j === i ? 'w-8 bg-light-primary' : 'w-2.5 bg-light-outline-variant') + ' rounded-full transition-all"></button>').join('');
    dots.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { clearInterval(timer); show(Number(b.dataset.i)); }));
    cur = i;
  }
  let cur = 0; show(0);
  const timer = setInterval(() => show((cur + 1) % slides.length), 5000);
})();
</script>
