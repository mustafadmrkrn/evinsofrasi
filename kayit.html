<script>
(async () => {
  const c = await ES.init({ role: 'public', redirectIfAuthed: 'anasayfa.html' });
  if (!c) return;
  const $ = (id) => document.getElementById(id);
  const S = { step: 1, smsOk: false, districts: [], cities: [], lat: null, lng: null, map: null, marker: null };
  const titles = ['Adım 1 / 3 · Kişisel Bilgiler', 'Adım 2 / 3 · Bölge ve Adres', 'Adım 3 / 3 · Üyelik Özeti'];
  const labels = ['1. Bilgiler', '2. Adres & Bölge', '3. Özet'];

  function go(n) {
    S.step = n;
    [1, 2, 3].forEach((i) => { $('p' + i).classList.toggle('hidden', i !== n); $('p' + i).classList.toggle('flex', i === n); });
    $('step-subtitle').textContent = titles[n - 1];
    $('steps').innerHTML = labels.map((l, i) => '<div class="flex flex-col gap-1.5"><span class="h-1.5 w-full rounded-full ' + (i < n ? 'bg-light-primary' : 'bg-light-surface-container-highest') + '"></span><span class="font-body text-label-sm ' + (i < n ? 'text-light-primary' : 'text-light-on-surface-variant') + '">' + l + '</span></div>').join('');
    if (n === 2) { initMap(); setTimeout(() => S.map && S.map.invalidateSize(), 50); }
    if (n === 3) summary();
    window.scrollTo(0, 0);
  }
  go(1);

  // ----- Adım 1: demo SMS -----
  $('sms').addEventListener('click', () => {
    if (($('tel').value.replace(/\D/g, '')).length < 10) return ES.toast('Önce geçerli bir telefon numarası gir', 'error');
    ES.toast('Demo modu: doğrulama kodu 123456', 'ok');
  });
  $('kod').addEventListener('input', () => {
    S.smsOk = $('kod').value.trim() === '123456';
    $('kod-durum').textContent = S.smsOk ? 'Doğrulandı' : 'Demo: kod 123456';
    $('kod-durum').className = 'font-body text-label-sm ' + (S.smsOk ? 'text-success' : 'text-light-on-surface-variant');
    $('kod').classList.toggle('border-success', S.smsOk);
  });
  $('n1').addEventListener('click', () => {
    if ($('ad').value.trim().length < 3) return ES.toast('Ad soyadını yaz', 'error');
    if ($('tel').value.replace(/\D/g, '').length < 10) return ES.toast('Geçerli bir telefon numarası gir', 'error');
    if (!S.smsOk) return ES.toast('SMS kodunu doğrula (demo kod: 123456)', 'error');
    if (!/^\S+@\S+\.\S+$/.test($('mail').value.trim())) return ES.toast('Geçerli bir e-posta gir', 'error');
    if ($('pw').value.length < 6) return ES.toast('Şifre en az 6 karakter olmalı', 'error');
    go(2);
  });

  // ----- Adım 2: il/ilçe + harita -----
  try {
    S.cities = await ES.q(ES.sb.from('cities').select('*').order('name'));
    S.districts = await ES.q(ES.sb.from('districts').select('*').order('name'));
  } catch (e) { ES.fail(e); }
  S.cities = S.cities.filter((x) => S.districts.some((d) => d.city_id === x.id));
  $('il').innerHTML = S.cities.map((x) => '<option value="' + x.id + '">' + ES.esc(x.name) + '</option>').join('');
  function fillDistricts() {
    const cid = Number($('il').value);
    $('ilce').innerHTML = S.districts.filter((d) => d.city_id === cid).map((d) => '<option value="' + d.id + '">' + ES.esc(d.name) + (d.status === 'active' ? ' (Aktif)' : ' (Yakında)') + '</option>').join('');
    onDistrict();
  }
  const curDistrict = () => S.districts.find((d) => d.id === Number($('ilce').value));
  const curCity = () => S.cities.find((x) => x.id === Number($('il').value));
  async function geocode(q) {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=tr&countrycodes=tr&q=' + encodeURIComponent(q));
    const j = await r.json(); return j[0] ? { lat: Number(j[0].lat), lng: Number(j[0].lon), name: j[0].display_name } : null;
  }
  async function reverse(lat, lng) {
    try { const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&accept-language=tr&lat=' + lat + '&lon=' + lng); const j = await r.json(); const a = j.address || {}; const line = [a.neighbourhood || a.suburb || a.quarter, a.road].filter(Boolean).join(' ') || (j.display_name || '').split(',').slice(0, 2).join(','); if (line) $('adres').value = line; } catch (e) { /* adres elle girilebilir */ }
  }
  function setPin(lat, lng, zoom) {
    S.lat = lat; S.lng = lng;
    if (!S.map) return;
    S.map.setView([lat, lng], zoom || S.map.getZoom());
    if (S.marker) S.marker.setLatLng([lat, lng]);
  }
  function initMap() {
    if (S.map || typeof L === 'undefined') { if (typeof L === 'undefined') $('map').innerHTML = '<div class="p-4 text-body-sm">Harita yüklenemedi (internet?). Adresi elle yazabilirsin.</div>'; return; }
    S.map = L.map('map').setView([S.lat || 39, S.lng || 35], S.lat ? 15 : 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(S.map);
    S.marker = L.marker([S.lat || 39, S.lng || 35], { draggable: true }).addTo(S.map);
    S.marker.on('dragend', () => { const p = S.marker.getLatLng(); S.lat = p.lat; S.lng = p.lng; reverse(p.lat, p.lng); });
    S.map.on('click', (e) => { S.marker.setLatLng(e.latlng); S.lat = e.latlng.lat; S.lng = e.latlng.lng; reverse(e.latlng.lat, e.latlng.lng); });
    if (S.lat) setPin(S.lat, S.lng, 15);
  }
  async function onDistrict() {
    const d = curDistrict(); if (!d) return;
    const soon = d.status !== 'active';
    $('soon').classList.toggle('hidden', !soon); $('soon').classList.toggle('flex', soon);
    $('n2').disabled = soon; $('n2').style.opacity = soon ? '.5' : '';
    try { const g = await geocode(d.name + ', ' + curCity().name + ', Türkiye'); if (g) { S.lat = g.lat; S.lng = g.lng; if (S.map) setPin(g.lat, g.lng, 13); } } catch (e) { /* sessiz */ }
  }
  $('il').addEventListener('change', fillDistricts);
  $('ilce').addEventListener('change', onDistrict);
  fillDistricts();
  $('notify').addEventListener('click', () => ES.busy($('notify'), async () => {
    const d = curDistrict();
    await ES.q(ES.sb.from('notify_requests').insert({ district_id: d.id, contact: ($('mail').value || $('tel').value).trim() }));
    ES.toast('Teşekkürler! ' + d.name + ' açıldığında haber vereceğiz.', 'ok');
  }));
  async function search() {
    const q = $('ara').value.trim(); if (!q) return;
    const g = await geocode(q + ', ' + curDistrict().name + ', ' + curCity().name + ', Türkiye');
    if (!g) return ES.toast('Adres bulunamadı, pini elle sürükle', 'error');
    setPin(g.lat, g.lng, 16); reverse(g.lat, g.lng);
  }
  $('araBtn').addEventListener('click', () => search().catch(ES.fail));
  $('ara').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search().catch(ES.fail); } });
  $('loc').addEventListener('click', () => {
    if (!navigator.geolocation) return ES.toast('Tarayıcı konumu desteklemiyor', 'error');
    navigator.geolocation.getCurrentPosition((p) => { setPin(p.coords.latitude, p.coords.longitude, 17); reverse(p.coords.latitude, p.coords.longitude); }, () => ES.toast('Konum alınamadı, pini elle sürükle', 'error'), { timeout: 8000 });
  });
  $('n2').addEventListener('click', () => {
    if (curDistrict().status !== 'active') return;
    if ($('adres').value.trim().length < 3) return ES.toast('Mahalle / cadde bilgisini yaz', 'error');
    if (!$('bina').value.trim()) return ES.toast('Bina numarasını yaz', 'error');
    go(3);
  });

  // ----- Adım 3 -----
  const fullAddress = () => $('adres').value.trim() + ' Bina ' + $('bina').value.trim() + (($('kat').value.trim()) ? ', Kat ' + $('kat').value.trim() : '') + (($('daire').value.trim()) ? ', Daire ' + $('daire').value.trim() : '');
  function summary() {
    $('s-ad').textContent = $('ad').value.trim();
    $('s-iletisim').textContent = $('tel').value.trim() + ' · ' + $('mail').value.trim();
    $('s-adres').textContent = fullAddress() + ' — ' + curDistrict().name + ' / ' + curCity().name;
  }
  $('n3').addEventListener('click', () => ES.busy($('n3'), async () => {
    const d = curDistrict();
    const meta = { full_name: $('ad').value.trim(), phone: $('tel').value.trim(), district_id: String(d.id), address_text: $('adres').value.trim(), building: $('bina').value.trim(), floor: $('kat').value.trim(), apartment: $('daire').value.trim(), lat: S.lat == null ? '' : String(S.lat), lng: S.lng == null ? '' : String(S.lng) };
    const email = $('mail').value.trim(), pw = $('pw').value;
    const { data, error } = await ES.sb.auth.signUp({ email, password: pw, options: { data: meta } });
    if (error) throw new Error(/already/i.test(error.message) ? 'Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.' : error.message);
    if (!data.session) {
      const r = await ES.sb.auth.signInWithPassword({ email, password: pw });
      if (r.error) throw new Error('Hesap oluştu ama e-posta onayı isteniyor. Supabase > Authentication > Providers > Email bölümünde "Confirm email" seçeneğini kapatıp tekrar giriş yap.');
    }
    location.replace('anasayfa.html');
  }));
})();
</script>

</body></html>
