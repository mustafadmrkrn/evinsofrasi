<div id="boot"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'kitchen' });
  if (!c) return;
  const k = c.kitchen;
  const root = ES.mountKitchen('rapor', 'Raporlar', 'Son 14 günün sipariş, porsiyon ve ciro özeti (yarın dahil)');
  let rows = [];
  try { rows = await ES.q(ES.sb.rpc('kitchen_report', { p_kitchen: k.id, p_days: 14 })); } catch (e) { ES.fail(e); return; }
  const past = rows.filter((r) => r.day <= ES.todayISO());
  const sum = (key, arr) => arr.reduce((a, r) => a + Number(r[key]), 0);
  const max = Math.max(1, ...rows.map((r) => r.orders));
  const card = 'bg-light-surface-container-lowest rounded-lg p-gutter-lg border border-light-outline-variant shadow-sm flex flex-col gap-1';
  root.innerHTML = '<section class="grid grid-cols-3 gap-gutter-lg">' +
    '<article class="' + card + '"><span class="font-body text-label-md text-light-on-surface-variant">Toplam Sipariş (14 gün)</span><span class="font-headline text-display-lg text-light-primary tabular-nums">' + sum('orders', past) + '</span></article>' +
    '<article class="' + card + '"><span class="font-body text-label-md text-light-on-surface-variant">Toplam Porsiyon</span><span class="font-headline text-display-lg tabular-nums">' + sum('portions', past) + '</span></article>' +
    '<article class="' + card + '"><span class="font-body text-label-md text-light-on-surface-variant">Ciro</span><span class="font-headline text-display-lg text-terracotta tabular-nums">' + ES.money(sum('revenue', past)) + '</span></article></section>' +
    '<section class="bg-light-surface-container-lowest rounded-lg border border-light-outline-variant shadow-sm overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-light-surface-container-low">' + ['Tarih', 'Sipariş', 'Porsiyon', 'Ciro', ''].map((h) => '<th class="px-5 py-3 font-body text-label-md text-light-on-surface-variant">' + h + '</th>').join('') + '</tr></thead><tbody class="divide-y divide-light-outline-variant">' +
    rows.map((r) => '<tr><td class="px-5 py-3 font-body text-title-md tabular-nums"><a class="underline" href="mutfak-sabah.html?d=' + r.day + '">' + ES.trDate(r.day) + '</a>' + (r.day === ES.todayISO() ? ' <span class="px-2 py-0.5 rounded-full bg-success-container text-on-success-container font-body text-label-sm">Bugün</span>' : r.day > ES.todayISO() ? ' <span class="px-2 py-0.5 rounded-full bg-light-secondary-container text-light-on-secondary-container font-body text-label-sm">Yarın</span>' : '') + '</td><td class="px-5 py-3 tabular-nums font-body text-body-md">' + r.orders + '</td><td class="px-5 py-3 tabular-nums font-body text-body-md">' + r.portions + '</td><td class="px-5 py-3 tabular-nums font-body text-body-md">' + ES.money(r.revenue) + '</td><td class="px-5 py-3 w-1/3"><div class="h-3 rounded-full bg-light-surface-container overflow-hidden"><div class="h-full rounded-full bg-light-primary" style="width:' + Math.round(100 * r.orders / max) + '%"></div></div></td></tr>').join('') + '</tbody></table></section>';
})();
</script>
