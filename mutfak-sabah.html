<div id="boot"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'kitchen' });
  if (!c) return;
  const d = ES.kitchenDate(), k = c.kitchen;
  const root = ES.mountKitchen('sabah', 'Sabah Özeti', ES.trDate(d) + ' · ' + (d === ES.todayISO() ? '00:00 kapanışı sonrası kesinleşen veriler' : 'sipariş toplamı'), '<a href="mutfak-uretim.html?d=' + d + '" class="inline-flex items-center gap-2 min-h-[44px] px-5 rounded-full bg-light-primary text-light-on-primary font-body text-label-lg"><span class="material-symbols-outlined text-[18px]">skillet</span>Üretim Planına Git</a>');
  let s;
  try { s = await ES.q(ES.sb.rpc('kitchen_summary', { p_kitchen: k.id, p_date: d })); } catch (e) { ES.fail(e); return; }
  const pct = (a) => (s.total ? Math.round((100 * a) / s.total) : 0);
  // hazırlık uyarısı: ilk öğle diliminden 3 saat önce
  let alert = '';
  if (s.ogle > 0 && s.first_ogle_slot) {
    const [h, m] = s.first_ogle_slot.split(':').map(Number); const start = ((h - 3) + 24) % 24; const prep = String(start).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    let left = '';
    if (d === ES.todayISO()) { const [nh, nm] = ES.nowHM().split(':').map(Number); const diff = (start * 60 + m) - (nh * 60 + nm); left = diff > 0 ? '<span class="px-3 py-1 rounded-full bg-warning text-on-warning font-mono text-mono-sm tabular-nums">' + Math.floor(diff / 60) + ':' + String(diff % 60).padStart(2, '0') + ' kaldı</span>' : '<span class="px-3 py-1 rounded-full bg-warning text-on-warning font-mono text-mono-sm">Hazırlık saati geçti</span>'; }
    alert = '<div role="alert" class="bg-warning-container text-on-warning-container rounded-lg px-gutter-xl py-4 border border-light-outline-variant flex items-center justify-between gap-gutter-md"><div class="flex items-center gap-gutter-md"><span class="material-symbols-outlined text-[24px] text-warning">schedule</span><div><span class="block font-body text-title-md">Öğle siparişleri için hazırlık ' + prep + '\'da başlamalı</span><span class="block font-body text-body-sm">' + s.ogle + ' öğle siparişi için ilk teslimat dilimi ' + ES.hm(s.first_ogle_slot) + '.</span></div></div>' + left + '</div>';
  }
  const max = Math.max(1, ...s.by_dish.map((x) => x.qty));
  const card = 'bg-light-surface-container-lowest rounded-lg p-gutter-lg border border-light-outline-variant shadow-sm flex flex-col gap-1';
  root.innerHTML = alert +
  '<section class="grid grid-cols-3 gap-gutter-lg">' +
    '<article class="' + card + '"><span class="font-body text-label-md text-light-on-surface-variant">00:00\'a Kadar Toplam Sipariş</span><span class="font-headline text-display-lg text-light-primary tabular-nums">' + s.total + '</span><span class="font-body text-body-sm text-success">Ciro: ' + ES.money(s.revenue) + ' · sıfır atık için planlı üretim</span></article>' +
    '<article class="' + card + '"><span class="font-body text-label-md text-light-on-surface-variant">Öğle / Akşam Dağılımı</span><div class="flex items-baseline gap-gutter-lg"><div><span class="font-headline text-headline-lg tabular-nums">' + s.ogle + '</span> <span class="font-body text-body-sm text-light-on-surface-variant">Öğle</span></div><span class="text-light-outline-variant">/</span><div><span class="font-headline text-headline-lg text-terracotta tabular-nums">' + s.aksam + '</span> <span class="font-body text-body-sm text-light-on-surface-variant">Akşam</span></div></div><span class="font-body text-body-sm text-light-on-surface-variant">%' + pct(s.ogle) + ' Öğle · %' + pct(s.aksam) + ' Akşam</span></article>' +
    '<article class="' + card + '"><span class="font-body text-label-md text-light-on-surface-variant">Teslimat Yöntemi</span><div class="flex items-baseline gap-gutter-lg"><div><span class="font-headline text-headline-lg tabular-nums">' + s.delivery + '</span> <span class="font-body text-body-sm text-light-on-surface-variant">Eve Teslim</span></div><span class="text-light-outline-variant">/</span><div><span class="font-headline text-headline-lg text-light-primary tabular-nums">' + s.pickup + '</span> <span class="font-body text-body-sm text-light-on-surface-variant">Gel Al</span></div></div><span class="font-body text-body-sm text-light-on-surface-variant">Aktif Paket Üyesi: <strong class="tabular-nums">' + s.package_members + '</strong></span></article></section>' +
  '<section class="bg-light-surface-container-lowest rounded-lg p-gutter-xl border border-light-outline-variant shadow-sm flex flex-col gap-gutter-lg"><div class="flex items-center justify-between"><div><h2 class="font-headline text-headline-sm">Yemeklere Göre Sipariş Dağılımı</h2><p class="font-body text-body-sm text-light-on-surface-variant">Toplam porsiyon adedi (Öğle + Akşam)</p></div><span class="px-3 py-1 rounded-full bg-light-secondary-container text-light-on-secondary-container font-body text-label-sm">' + ES.esc(k.name) + '</span></div>' +
    (s.by_dish.length ? '<div class="flex flex-col gap-gutter-md">' + s.by_dish.map((x, i) => '<div class="grid grid-cols-12 items-center gap-gutter-md"><span class="col-span-3 font-body text-title-md">' + ES.esc(x.name) + '</span><div class="col-span-8 h-7 rounded-full bg-light-surface-container overflow-hidden"><div class="h-full rounded-full ' + (i === 0 ? 'bg-terracotta' : 'bg-light-primary') + '" style="width:' + Math.max(3, Math.round(100 * x.qty / max)) + '%"></div></div><span class="col-span-1 text-right font-body text-title-md tabular-nums">' + x.qty + '</span></div>').join('') + '</div>' : '<p class="font-body text-body-md text-light-on-surface-variant">Bu tarih için henüz sipariş yok.</p>') + '</section>';

  const live = document.createElement('section');
  live.className = 'bg-light-surface-container-lowest rounded-lg p-gutter-xl border border-light-outline-variant shadow-sm flex flex-col gap-gutter-md';
  root.insertBefore(live, root.firstChild);
  async function refreshLive() {
    try {
      const tm = ES.tomorrowISO(), td = ES.todayISO();
      const os = await ES.q(ES.sb.from('orders').select('id,order_no,target_date,meal,method,total,created_at,user_id,order_items(name,qty)').eq('kitchen_id', k.id).in('target_date', [td, tm]).neq('status', 'cancelled').order('created_at', { ascending: false }).limit(40));
      const ids = [...new Set(os.map((o) => o.user_id))];
      const ps = ids.length ? await ES.q(ES.sb.from('profiles').select('id,full_name').in('id', ids)) : [];
      const pm = Object.fromEntries(ps.map((p) => [p.id, p.full_name]));
      const n = (dt) => os.filter((o) => o.target_date === dt).length;
      const tf = (iso) => new Date(iso).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Istanbul' });
      live.innerHTML = '<div class="flex items-center justify-between gap-gutter-md flex-wrap"><div class="flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 rounded-full bg-success"></span><h2 class="font-headline text-headline-sm">Anlık Siparişler</h2></div><span class="font-body text-body-sm text-light-on-surface-variant">Yarın için: <strong>' + n(tm) + '</strong> · Bugün için: <strong>' + n(td) + '</strong> · 10 sn\'de bir yenilenir</span></div>' +
        (os.length ? '<div class="flex flex-col divide-y divide-light-outline-variant">' + os.map((o) => '<div class="py-2.5 flex items-center justify-between gap-gutter-md flex-wrap"><div class="flex items-center gap-gutter-md min-w-0"><span class="font-mono text-mono-sm tabular-nums text-light-on-surface-variant">' + tf(o.created_at) + '</span><span class="font-body text-title-md">' + ES.esc(o.order_no) + '</span><span class="font-body text-body-md truncate">' + ES.esc(pm[o.user_id] || '-') + '</span><span class="px-2 py-0.5 rounded-full ' + (o.target_date === tm ? 'bg-light-secondary-container text-light-on-secondary-container' : 'bg-light-primary-container text-light-on-primary-container') + ' font-body text-label-sm">' + (o.target_date === tm ? 'Yarın' : 'Bugün') + ' · ' + ES.MEAL[o.meal] + ' · ' + (o.method === 'delivery' ? 'Eve Teslim' : 'Gel Al') + '</span></div><div class="font-body text-body-sm text-light-on-surface-variant">' + o.order_items.map((i) => (i.qty > 1 ? i.qty + '× ' : '') + ES.esc(i.name)).join(', ') + ' · <strong>' + ES.money(o.total) + '</strong></div></div>').join('') + '</div>' : '<p class="font-body text-body-md text-light-on-surface-variant">Henüz sipariş yok. Yeni sipariş gelince burada anında görünür.</p>');
    } catch (e) { /* sonraki turda tekrar dener */ }
  }
  refreshLive(); setInterval(refreshLive, 10000);
})();
</script>
