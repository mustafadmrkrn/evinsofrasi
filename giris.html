<div class="min-h-[884px] max-w-[390px] mx-auto bg-light-surface flex flex-col">

    <a href="index.html" aria-label="Geri" class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-light-surface-container-lowest border border-light-outline-variant"><span class="material-symbols-outlined text-[20px]">arrow_back</span></a>
    <h1 class="font-headline text-title-lg text-light-on-surface">Giriş Yap</h1>
  </header>
  <main class="flex-1 px-page-margin py-gutter-xl flex flex-col gap-gutter-lg">
    <p class="font-body text-body-md text-light-on-surface-variant">Sistemimiz sadece üyelere açıktır. Mutfak personeli de aynı girişi kullanır.</p>
    <form id="f" class="bg-light-surface-container-lowest rounded-lg p-gutter-lg border border-light-outline-variant shadow-sm flex flex-col gap-gutter-md">
      <div class="flex flex-col gap-1.5"><label for="email" class="font-body text-label-md">E-posta veya kullanıcı adı</label><input id="email" type="text" autocapitalize="none" autocomplete="username" required class="w-full min-h-[48px] px-4 rounded-md bg-light-surface-container-low border border-light-outline-variant text-body-md"></div>
      <div class="flex flex-col gap-1.5"><label for="pw" class="font-body text-label-md">Şifre</label><input id="pw" type="password" autocomplete="current-password" required class="w-full min-h-[48px] px-4 rounded-md bg-light-surface-container-low border border-light-outline-variant text-body-md"></div>
      <button id="go" type="submit" class="inline-flex items-center justify-center w-full min-h-[52px] px-6 py-3 rounded-full bg-light-primary text-light-on-primary shadow-sm font-body text-label-lg">Giriş Yap</button>
    </form>
    <p class="text-center font-body text-body-md">Hesabın yok mu? <a class="text-light-primary underline" href="kayit.html">Üye ol</a></p>
  </main>
</div>
<script>
(async () => {
  const c = await ES.init({ role: 'public' });
  if (!c) return;
  const next = new URLSearchParams(location.search).get('next');
  if (c.session) { go(); return; }
  async function go() {
    if (next && /^[a-z0-9\-]+\.html/i.test(next)) { location.replace(next); return; }
    const p = await ES.q(ES.sb.from('profiles').select('role').eq('id', (await ES.sb.auth.getSession()).data.session.user.id).single());
    location.replace(p.role === 'admin' ? 'admin.html' : p.role === 'kitchen' ? 'mutfak-sabah.html' : 'anasayfa.html');
  }
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    ES.busy(document.getElementById('go'), async () => {
      const { error } = await ES.sb.auth.signInWithPassword({ email: (function (v) { v = v.trim(); return v.includes('@') ? v : v.toLowerCase() + '@evinsofrasi.local'; })(document.getElementById('email').value), password: document.getElementById('pw').value });
      if (error) {
        if (/not confirmed/i.test(error.message)) throw new Error('E-posta onayı açık görünüyor. Supabase > Authentication > Providers > Email bölümünde "Confirm email" seçeneğini kapat.');
        throw new Error(/invalid/i.test(error.message) ? 'E-posta veya şifre hatalı' : error.message);
      }
      await go();
    });
  });
})();
</script>
