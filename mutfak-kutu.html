<body class="bg-light-surface text-light-on-surface font-body antialiased">
<div id="boot"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'kitchen' });
  if (!c) return;
  const k = c.kitchen, d = ES.kitchenDate();
  const root = ES.mountKitchen('kutu', 'Kutular', 'Kutu ürünlerini yönet · seçili tarihin paketleme listesi');
  const ST = { placed: 'Alındı', packing: 'Paketleniyor', ready: 'Hazır', on_the_way: 'Yolda', delivered: 'Teslim edildi', cancelled: 'İptal' };
  const NEXT = { placed: 'packing', packing: 'ready', ready: 'on_the_way', on_the_way: 'delivered' };
  const STO = { cold: 'Soğuk', frozen: 'Dondurulmuş', dry: 'Kuru' };
  const inp = 'rounded-md border border-light-outline-variant px-3 py-2 font-body text-body-md bg-light-surface-container-lowest w-full';
  let kits = [], orders = [];
  async function load() {
    kits = await ES.q(ES.sb.from('kits').select('*').eq('kitchen_id', k.id).order('id'));
    orders = await ES.q(ES.sb.from('kit_orders').select('*').eq('kitchen_id', k.id).eq('target_date', d).neq('status', 'cancelled').order('window_label').order('id'));
    render();
  }
  const lines = (s) => s.split('\n').map((x) => x.trim()).filter(Boolean);
  function render() {
    const by = {}; orders.forEach((o) => { const e = by[o.kit_id] = by[o.kit_id] || { name: o.kit_name, boxes: 0, bySv: {} }; e.boxes += o.qty; e.bySv[o.servings] = (e.bySv[o.servings] || 0) + o.qty; });
    const card = 'bg-light-surface-container-lowest rounded-lg border border-light-outline-variant p-gutter-lg flex flex-col gap-gutter-md';
    root.innerHTML =
      '<section class="' + card + '"><h2 class="font-headline text-headline-sm">Paketleme listesi · ' + ES.trDate(d) + '</h2>' +
      (Object.keys(by).length ? '<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-md">' + Object.values(by).map((e) => '<div class="p-gutter-md rounded-md bg-light-surface-container-low border border-light-outline-variant"><b class="font-body text-title-md">' + ES.esc(e.name) + '</b><div class="font-body text-body-md">Toplam ' + e.boxes + ' kutu</div><div class="font-body text-body-sm text-light-on-surface-variant">' + Object.keys(e.bySv).map((s) => e.bySv[s] + ' adet ' + s + ' kişilik').join(' · ') + '</div></div>').join('') + '</div>' : '<p class="text-light-on-surface-variant font-body text-body-md">Bu tarih için kutu siparişi yok.</p>') + '</section>' +
      '<section class="' + card + '"><h2 class="font-headline text-headline-sm">Siparişler (' + orders.length + ')</h2>' +
      (orders.length ? '<div class="overflow-x-auto"><table class="w-full font-body text-body-sm"><thead><tr class="text-left text-light-on-surface-variant"><th class="py-2">No</th><th>Kutu</th><th>Saat</th><th>Teslimat</th><th>Durum</th><th></th></tr></thead><tbody>' + orders.map((o) => '<tr class="border-t border-light-outline-variant"><td class="py-2">' + ES.esc(o.order_no) + '</td><td>' + ES.esc(o.kit_name) + '<br><span class="text-light-on-surface-variant">' + o.qty + ' × ' + o.servings + ' kişi</span></td><td>' + ES.esc(o.window_label) + '</td><td>' + (o.method === 'pickup' ? 'Gel Al' : ES.esc((o.ship_label || '') + ' — ' + (o.ship_address || ''))) + '</td><td>' + ST[o.status] + '</td><td>' + (NEXT[o.status] ? '<button data-next="' + o.id + ':' + NEXT[o.status] + '" class="px-3 py-1.5 rounded-full bg-light-primary text-light-on-primary text-label-md">→ ' + ST[NEXT[o.status]] + '</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="text-light-on-surface-variant font-body text-body-md">Sipariş yok.</p>') + '</section>' +
      '<section class="' + card + '"><h2 class="font-headline text-headline-sm">Kutu ürünleri</h2>' +
      (kits.length ? '<div class="overflow-x-auto"><table class="w-full font-body text-body-sm"><thead><tr class="text-left text-light-on-surface-variant"><th class="py-2">Ad</th><th>Tür</th><th>Saklama</th><th>₺/kişi</th><th>Günlük kota</th><th>Satışta</th><th></th></tr></thead><tbody>' + kits.map((x) => '<tr class="border-t border-light-outline-variant"><td class="py-2">' + ES.esc(x.name) + '</td><td>' + (x.kind === 'box' ? 'Çok tarifli' : 'Tek ürün') + '</td><td>' + STO[x.storage] + '</td><td><input data-price="' + x.id + '" type="number" min="0" value="' + x.price_per_serving + '" class="w-24 ' + inp.replace('w-full', '') + '"></td><td><input data-quota="' + x.id + '" type="number" min="0" placeholder="sınırsız" value="' + (x.daily_quota == null ? '' : x.daily_quota) + '" class="w-24 ' + inp.replace('w-full', '') + '"></td><td><input data-active="' + x.id + '" type="checkbox"' + (x.active ? ' checked' : '') + '></td><td><button data-del="' + x.id + '" class="underline text-light-error">Sil</button></td></tr>').join('') + '</tbody></table></div>' : '<p class="text-light-on-surface-variant font-body text-body-md">Henüz kutu yok.</p>') + '</section>' +
      '<section class="' + card + '"><h2 class="font-headline text-headline-sm">Yeni kutu ekle</h2><form id="nf" class="grid grid-cols-1 md:grid-cols-2 gap-gutter-md">' +
      '<label class="flex flex-col gap-1">Ad<input name="name" required class="' + inp + '"></label>' +
      '<label class="flex flex-col gap-1">Tür<select name="kind" class="' + inp + '"><option value="single">Tek ürün kutusu (ör. mantı)</option><option value="box">Çok tarifli kutu</option></select></label>' +
      '<label class="flex flex-col gap-1 md:col-span-2">Açıklama<input name="description" class="' + inp + '"></label>' +
      '<label class="flex flex-col gap-1">Kişi başı fiyat (₺)<input name="price" type="number" min="0" step="0.5" required class="' + inp + '"></label>' +
      '<label class="flex flex-col gap-1">Günlük kota (kutu, boşsa sınırsız)<input name="quota" type="number" min="0" class="' + inp + '"></label>' +
      '<label class="flex flex-col gap-1">Kişi seçenekleri (virgülle)<input name="serves" value="2,4" class="' + inp + '"></label>' +
      '<label class="flex flex-col gap-1">Saklama<select name="storage" class="' + inp + '"><option value="cold">Soğuk (buzdolabı)</option><option value="frozen">Dondurulmuş</option><option value="dry">Kuru</option></select></label>' +
      '<label class="flex flex-col gap-1">Raf ömrü (gün)<input name="shelf" type="number" min="1" class="' + inp + '"></label>' +
      '<label class="flex flex-col gap-1">Menü tipi<select name="diet" class="' + inp + '">' + Object.keys(ES.DIET).map((x) => '<option value="' + x + '">' + ES.DIET[x] + '</option>').join('') + '</select></label>' +
      '<label class="flex flex-col gap-1 md:col-span-2">Kutunun içi (her satıra bir kalem)<textarea name="contents" rows="4" required class="' + inp + '"></textarea></label>' +
      '<label class="flex flex-col gap-1 md:col-span-2">Tarif adımları (her satıra bir adım)<textarea name="recipe" rows="4" class="' + inp + '"></textarea></label>' +
      '<button class="md:col-span-2 py-3 rounded-full bg-light-primary text-light-on-primary font-body text-label-lg">Kutuyu ekle</button></form></section>';
    root.querySelectorAll('[data-next]').forEach((b) => b.addEventListener('click', () => ES.busy(b, async () => { const [id, st] = b.dataset.next.split(':'); await ES.q(ES.sb.from('kit_orders').update({ status: st }).eq('id', Number(id))); await load(); })));
    root.querySelectorAll('[data-price]').forEach((i) => i.addEventListener('change', async () => { const v = Number(i.value); if (!(v >= 0)) return ES.toast('Geçersiz fiyat', 'error'); try { await ES.q(ES.sb.from('kits').update({ price_per_serving: v }).eq('id', Number(i.dataset.price))); ES.toast('Fiyat güncellendi', 'ok'); } catch (e) { ES.fail(e); } }));
    root.querySelectorAll('[data-quota]').forEach((i) => i.addEventListener('change', async () => { const raw = i.value.trim(); const v = raw === '' ? null : Number(raw); if (v !== null && !(v >= 0)) return ES.toast('Geçersiz kota', 'error'); try { await ES.q(ES.sb.from('kits').update({ daily_quota: v }).eq('id', Number(i.dataset.quota))); ES.toast('Kota güncellendi', 'ok'); } catch (e) { ES.fail(e); } }));
    root.querySelectorAll('[data-active]').forEach((i) => i.addEventListener('change', async () => { try { await ES.q(ES.sb.from('kits').update({ active: i.checked }).eq('id', Number(i.dataset.active))); } catch (e) { ES.fail(e); } }));
    root.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => { if (!confirm('Bu kutu silinsin mi? (Geçmiş siparişler kalır)')) return; ES.busy(b, async () => { await ES.q(ES.sb.from('kits').delete().eq('id', Number(b.dataset.del))); await load(); }); }));
    root.querySelector('#nf').addEventListener('submit', (e) => { e.preventDefault(); const f = e.target, g = (n) => f.elements[n].value.trim(); ES.busy(f.querySelector('button'), async () => {
      const serves = g('serves').split(',').map((x) => Number(x.trim())).filter((x) => x >= 1 && x <= 12);
      if (!serves.length) throw new Error('Kişi seçeneklerini sayı olarak gir (ör. 2,4)');
      await ES.q(ES.sb.from('kits').insert({ kitchen_id: k.id, name: g('name'), description: g('description') || null, kind: g('kind'), diet: g('diet'), serves, price_per_serving: Number(g('price')), daily_quota: g('quota') === '' ? null : Number(g('quota')), storage: g('storage'), shelf_life_days: g('shelf') ? Number(g('shelf')) : null, contents: lines(f.elements.contents.value), recipe: lines(f.elements.recipe.value) }));
      ES.toast('Kutu eklendi', 'ok'); await load(); }); });
  }
  try { await load(); } catch (e) { ES.fail(e); }
})();
</script>
