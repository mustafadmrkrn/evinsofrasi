<body class="bg-light-surface text-light-on-surface font-body antialiased">
<div class="min-h-[884px] max-w-[390px] mx-auto bg-light-surface flex flex-col pb-24" id="app"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'customer' });
  if (!c) return;
  const app = document.getElementById('app');
  if (!c.kitchen) { app.innerHTML = ES.appHeader('Teslimat Bölgesi', c.district ? c.district.name : '—', '') + ES.noKitchenBanner() + ES.tabbar('anasayfa'); return; }
  let dishes = [];
  try { dishes = await ES.q(ES.sb.from('dishes').select('*').eq('kitchen_id', c.kitchen.id).eq('active', true).order('category').order('price')); } catch (e) { ES.fail(e); }
  const cart = ES.Cart.get();
  let meal = cart.meal || 'ogle';

  function addToCart(d) {
    let ct = ES.Cart.get();
    if (ES.Cart.count(ct) > 0 && ct.meal !== meal && !confirm('Sepetinde ' + ES.MEAL[ct.meal] + ' öğünü ürünleri var. Sepeti temizleyip ' + ES.MEAL[meal] + ' öğününe geçilsin mi?')) return;
    if (ct.meal !== meal) ct = { meal, items: {}, editing: null };
    ct.meal = meal; ES.Cart.set(ct);
    ES.Cart.setQty(d, ((ES.Cart.get().items[d.id] || {}).q || 0) + 1);
    ES.refreshCartPill(); ES.toast(d.name + ' sepete eklendi', 'ok');
  }

  function render() {
    const list = dishes.filter((d) => d.meals.includes(meal));
    const hl = list.find((d) => d.is_highlight);
    const rest = list.filter((d) => !hl || d.id !== hl.id).slice(0, 3);
    app.innerHTML = ES.appHeader('Teslimat Bölgesi', c.district.name + ' / ' + c.district.cities.name, ES.cartPill()) +
    '<main class="flex-1 px-page-margin py-gutter-lg flex flex-col gap-gutter-xl">' +
      '<section class="bg-light-primary text-light-on-primary rounded-lg p-gutter-lg shadow-sm flex flex-col gap-gutter-md">' +
        '<div class="flex items-center justify-between gap-gutter-sm"><span class="font-body text-label-md">Yarının siparişleri için kalan süre</span><span class="px-2.5 py-0.5 rounded-full bg-light-secondary text-light-on-secondary font-body text-label-sm shrink-0">Kapanış 00:00</span></div>' +
        '<div class="flex items-baseline justify-between"><span id="cd" class="font-mono text-mono-lg tabular-nums tracking-wide">--:--:--</span><span class="font-body text-body-sm">' + ES.trDate(ES.tomorrowISO()) + ' üretimi için son saat</span></div>' +
        '<div class="w-full h-2 rounded-full bg-light-on-primary-container overflow-hidden"><div id="cdbar" class="h-full rounded-full bg-terracotta" style="width:50%"></div></div></section>' +
      '<div role="tablist" class="grid grid-cols-2 p-1 rounded-full bg-light-surface-container border border-light-outline-variant">' +
        ['ogle', 'aksam'].map((m) => '<button data-meal="' + m + '" class="min-h-[44px] px-3 py-2 rounded-full font-body text-label-md ' + (m === meal ? 'bg-light-primary text-light-on-primary shadow-sm' : 'text-light-on-surface-variant') + '">' + (m === 'ogle' ? 'Öğle (12–14)' : 'Akşam (18–20)') + '</button>').join('') + '</div>' +
      (hl ? '<section class="flex flex-col gap-gutter-sm"><div class="flex items-center justify-between"><h2 class="font-headline text-headline-sm">Bölgenin Lezzeti</h2><span class="px-2.5 py-1 rounded-full bg-light-secondary-container text-light-on-secondary-container font-body text-label-sm">' + ES.esc(hl.region_tag || c.district.name + ' Özel') + '</span></div>' +
        '<article class="bg-light-surface-container-lowest rounded-lg overflow-hidden border border-light-outline-variant shadow-sm">' + ES.dishImg(hl, 'w-full h-48 object-cover') +
        '<div class="p-gutter-lg flex flex-col gap-gutter-md"><div class="flex items-start justify-between gap-gutter-sm"><div><h3 class="font-headline text-title-lg">' + ES.esc(hl.name) + '</h3><p class="font-body text-body-md text-light-on-surface-variant text-pretty">' + ES.esc(hl.description || '') + '</p></div><span class="font-headline text-title-lg text-light-primary tabular-nums shrink-0">' + ES.money(hl.price) + '</span></div>' +
        '<button data-add="' + hl.id + '" class="inline-flex items-center justify-center gap-2 w-full min-h-[48px] px-5 py-2.5 rounded-full bg-light-primary text-light-on-primary font-body text-label-lg"><span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>Sepete Ekle</button></div></article></section>' : '') +
      '<section class="flex flex-col gap-gutter-md"><div class="flex items-center justify-between"><h2 class="font-headline text-headline-sm">Yarının Menüsü</h2><a href="menu.html" class="font-body text-label-md text-light-primary">Tümünü Gör</a></div>' +
        (rest.length ? rest.map((d) => '<article class="bg-light-surface-container-lowest rounded-lg p-gutter-md border border-light-outline-variant shadow-sm flex gap-gutter-md items-center">' + ES.dishImg(d, 'w-24 h-24 rounded-md object-cover shrink-0') +
          '<div class="flex-1 min-w-0 flex flex-col gap-1.5"><h3 class="font-body text-title-md">' + ES.esc(d.name) + '</h3><p class="font-body text-body-sm text-light-on-surface-variant text-pretty">' + ES.esc(d.description || '') + '</p>' +
          '<div class="flex items-center justify-between pt-1"><span class="font-body text-title-md text-light-primary tabular-nums">' + ES.money(d.price) + '</span><button data-add="' + d.id + '" class="min-h-[40px] px-4 rounded-full bg-light-primary text-light-on-primary font-body text-label-md">Sepete Ekle</button></div></div></article>').join('') : '<p class="font-body text-body-md text-light-on-surface-variant">Bu öğün için menü henüz hazırlanmadı.</p>') + '</section>' +
      '<section><a href="paketler.html" class="block bg-light-secondary-container text-light-on-secondary-container rounded-lg p-gutter-lg border border-light-outline-variant"><div class="flex items-center justify-between gap-gutter-md"><div class="flex flex-col gap-1"><span class="font-body text-label-sm text-light-secondary">%22\'ye Varan Avantaj</span><h3 class="font-headline text-title-lg">Haftalık ve Aylık Ev Paketleri</h3><p class="font-body text-body-sm">4 kap ev yemeğini günlük seç, istediğin gün atla.</p></div><span class="material-symbols-outlined text-[24px] shrink-0">arrow_forward_ios</span></div></a></section>' +
    '</main>' + ES.tabbar('anasayfa');
    app.querySelectorAll('[data-meal]').forEach((b) => b.addEventListener('click', () => { meal = b.dataset.meal; render(); }));
    app.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => addToCart(dishes.find((d) => d.id === Number(b.dataset.add)))));
    if (window.__cd) clearInterval(window.__cd);
    window.__cd = ES.startCountdown(document.getElementById('cd'), document.getElementById('cdbar'));
  }
  render();
})();
</script>
