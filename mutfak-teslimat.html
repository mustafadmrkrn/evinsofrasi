<body class="bg-light-surface text-light-on-surface font-body antialiased">
<div id="boot"></div>
<script>
(async () => {
  const c = await ES.init({ role: 'kitchen' });
  if (!c) return;
  const d = ES.kitchenDate(), k = c.kitchen;
  const root = ES.mountKitchen('teslimat', 'Teslimat ve Paketleme', 'Saat dilimine göre gruplanmış siparişler ve kurye çıkışı · ' + ES.trDate(d), '<button id="refresh" class="inline-flex items-center gap-2 min-h-[44px] px-5 rounded-full bg-light-surface-container-lowest border border-light-outline-variant font-body text-label-lg"><span class="material-symbols-outlined text-[18px]">refresh</span>Yenile</button>');
  let orders = [];
  async function load() {
    orders = await ES.q(ES.sb.from('orders').select('*, order_items(*), slots(id,start_time,end_time,capacity), profiles(full_name,phone,address_text,building,floor,apartment)').eq('kitchen_id', k.id).eq('target_date', d).neq('status', 'cancelled').order('id'));
    render();
  }
  const btn = (o) => {
    const pk = o.method === 'pickup';
    if (o.status === 'delivered') return '<button disabled class="w-full min-h-[44px] px-4 rounded-full bg-success-container text-on-success-container font-body text-label-md">Teslim Edildi ✓</button>';
    if (o.status === 'on_the_way' || o.status === 'ready') return '<button data-done="' + o.id + '" class="w-full min-h-[44px] px-4 rounded-full bg-light-primary text-light-on-primary font-body text-label-md">' + (pk ? 'Teslim Alındı' : 'Teslim Edildi') + '</button>';
    return '<button data-go="' + o.id + '" class="w-full min-h-[44px] px-4 rounded-full bg-light-primary text-light-on-primary font-body text-label-md">' + (pk ? 'Teslimata Hazır (Gel Al)' : 'Kuryeye Teslim Edildi') + '</button>';
  };
  function render() {
    const groups = {};
    orders.forEach((o) => { const key = o.meal + '|' + o.slot_id; (groups[key] = groups[key] || { slot: o.slots, meal: o.meal, list: [] }).list.push(o); });
    const keys = Object.keys(groups).sort((a, b) => groups[a].slot.start_time.localeCompare(groups[b].slot.start_time));
    root.innerHTML = keys.length ? keys.map((key) => { const g = groups[key]; const left = g.slot.capacity - g.list.length;
      return '<section class="flex flex-col gap-gutter-md"><div class="flex items-center justify-between"><h2 class="font-headline text-headline-sm tabular-nums">' + ES.hm(g.slot.start_time) + ' – ' + ES.hm(g.slot.end_time) + ' ' + ES.MEAL[g.meal] + ' Teslimat Dilimi</h2><span class="font-body text-label-md tabular-nums ' + (left <= 3 ? 'text-terracotta' : 'text-success') + '">' + (left > 0 ? left + ' kontenjan kaldı' : 'Dolu') + ' (' + g.list.length + '/' + g.slot.capacity + ')</span></div><div class="grid grid-cols-2 gap-gutter-lg">' +
      g.list.map((o) => { const p = o.profiles || {}; const where = o.method === 'pickup' ? k.name : [p.address_text, p.building && 'Bina ' + p.building, p.floor && 'Kat ' + p.floor, p.apartment && 'Daire ' + p.apartment].filter(Boolean).join(', ');
        return '<article class="bg-light-surface-container-lowest rounded-lg p-gutter-lg border border-light-outline-variant shadow-sm flex flex-col justify-between gap-gutter-md"><div class="flex flex-col gap-gutter-sm"><div class="flex items-start justify-between gap-gutter-sm"><div><span class="font-mono text-mono-sm text-light-primary tabular-nums">#' + o.order_no + '</span><h3 class="font-headline text-title-lg">' + ES.esc(p.full_name || 'Müşteri') + '</h3><span class="font-body text-body-sm text-light-on-surface-variant">' + ES.esc(where) + (p.phone ? ' · ' + ES.esc(p.phone) : '') + '</span></div><div class="flex flex-col items-end gap-1"><span class="px-3 py-1 rounded-full ' + (o.method === 'pickup' ? 'bg-light-primary-container text-light-on-primary-container' : 'bg-light-secondary-container text-light-on-secondary-container') + ' font-body text-label-sm">' + (o.method === 'pickup' ? 'Gel Al' : 'Eve Teslim') + '</span>' + (o.source === 'package' ? '<span class="px-2 py-0.5 rounded-full bg-light-tertiary-container text-light-on-tertiary-container font-body text-label-sm">Paket</span>' : '') + '</div></div>' +
        '<div class="flex flex-col gap-1.5 pt-2 border-t border-light-outline-variant">' + o.order_items.map((i) => '<label class="flex items-center gap-2 font-body text-body-md cursor-pointer"><input type="checkbox" data-pack="' + i.id + '" ' + (i.packed ? 'checked' : '') + ' class="rounded text-light-primary focus:ring-light-primary"><span>' + i.qty + 'x ' + ES.esc(i.name) + '</span></label>').join('') + '</div></div>' + btn(o) + '</article>'; }).join('') + '</div></section>'; }).join('') :
      '<div class="bg-light-surface-container-lowest rounded-lg p-gutter-xl border border-light-outline-variant font-body text-body-lg text-light-on-surface-variant">Bu tarih için teslimat yok.</div>';
    root.querySelectorAll('[data-pack]').forEach((cb) => cb.addEventListener('change', async () => { try { await ES.q(ES.sb.from('order_items').update({ packed: cb.checked }).eq('id', Number(cb.dataset.pack))); } catch (e) { ES.fail(e); cb.checked = !cb.checked; } }));
    root.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => ES.busy(b, async () => {
      const o = orders.find((x) => x.id === Number(b.dataset.go)); const patch = {};
      if (o.method === 'pickup') patch.status = 'ready';
      else { const last = localStorage.getItem('es_courier') || ''; const nm = prompt('Kurye adı (müşteri takip ekranında görünür):', last); if (nm === null) return; patch.status = 'on_the_way'; patch.courier_name = nm.trim() || null; try { localStorage.setItem('es_courier', nm.trim()); } catch (e) { /* yok say */ } }
      await ES.q(ES.sb.from('orders').update(patch).eq('id', o.id)); await load();
    })));
    root.querySelectorAll('[data-done]').forEach((b) => b.addEventListener('click', () => ES.busy(b, async () => { await ES.q(ES.sb.from('orders').update({ status: 'delivered' }).eq('id', Number(b.dataset.done))); await load(); })));
  }
  document.getElementById('refresh').addEventListener('click', () => load().catch(ES.fail));
  load().catch(ES.fail);
})();
</script>
